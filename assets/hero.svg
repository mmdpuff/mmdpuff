<text x="55" y="341" font-family="Arial, sans-serif" font-weight="600" font-size="23" fill="#D9DFFD">Mobile Engineering <tspan fill="#6B709E">×</tspan> Connected Hardware</text>
<text x="56" y="372" font-family="Consolas, monospace" font-size="15" fill="#9DA9CE">Flutter  /  Kotlin  /  ESP32  /  MicroPython</text>
<text x="56" y="419" font-family="Consolas, monospace" font-size="13" letter-spacing="2" fill="#7D87B1">github.com/mmdpuff</text>
