<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="456" viewBox="0 0 1280 456" role="img" aria-label="Mohammad M. Aghaei - Mobile developer and embedded systems explorer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060816"/><stop offset=".57" stop-color="#0C0E23"/><stop offset="1" stop-color="#111033"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7C8CFF"/><stop offset=".47" stop-color="#A78BFA"/><stop offset="1" stop-color="#38E8DE"/></linearGradient>
  <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <radialGradient id="mist"><stop stop-color="#8846FF" stop-opacity=".33"/><stop offset="1" stop-color="#8846FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="mist2"><stop stop-color="#21C5DA" stop-opacity=".27"/><stop offset="1" stop-color="#21C5DA" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M 34 0 L 0 0 0 34" fill="none" stroke="#7676B5" stroke-opacity=".10" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="18" flood-color="#000008" flood-opacity=".75"/></filter>
  <clipPath id="round"><rect x="1" y="1" width="1278" height="454" rx="22"/></clipPath>
  <style>
    .label{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:2.4px;font-size:15px;fill:#ACB6D9}
    .title{font-family:'Arial','Helvetica Neue',sans-serif;font-weight:900;letter-spacing:-3px;font-size:76px}
    .tiny{font-family:Consolas,'Liberation Mono',monospace;font-size:13px;letter-spacing:1.2px}
    .pulse{animation:pulse 3s ease-in-out infinite;transform-origin:center}
    .float{animation:float 7s ease-in-out infinite}
    .dash{stroke-dasharray:7 11;animation:move 14s linear infinite}
    @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-7px)}}
    @keyframes move{to{stroke-dashoffset:-216}}
    @media (prefers-reduced-motion:reduce){.pulse,.float,.dash{animation:none}}
  </style>
</defs>
<g clip-path="url(#round)">
<rect width="1280" height="456" fill="url(#bg)"/>
<rect width="1280" height="456" fill="url(#grid)"/>
<circle cx="965" cy="225" r="410" fill="url(#mist)"/>
<circle cx="1250" cy="70" r="300" fill="url(#mist2)"/>
