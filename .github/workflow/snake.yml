name: Animate GitHub contributions

on:
  workflow_dispatch:
  schedule:
    - cron: '21 2 * * *'

permissions:
  contents: write

jobs:
  snake:
    name: Build and publish contribution snake
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mmdpuff
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=purple
            dist/github-snake-dark.svg?palette=github-dark&color_snake=cyan

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
